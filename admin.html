<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | बारी परिणय सूत्र</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="brand"><div class="brand-mark">ॐ</div><div><h1>बारी परिणय सूत्र</h1><span>Secure Admin Panel</span></div></div><nav><a href="index.html">Public Site</a></nav></header>
<section class="section"><div class="section-head"><div><p class="eyebrow">ADMIN ONLY</p><h2>Profile Management</h2><p>केवल authorized admin account ही इस पैनल को access कर सकता है।</p></div><button class="btn light" id="logout">Logout</button></div>
<div id="loginBox"><form id="loginForm" class="form-grid"><input name="email" type="email" required placeholder="Admin email"><input name="password" type="password" required placeholder="Password"><button class="btn primary full" type="submit">Admin Login</button></form><p id="loginMsg" class="message"></p></div>
<div id="panel" hidden><div class="search-grid"><input id="aState" placeholder="State filter"><input id="aDistrict" placeholder="District filter"><input id="aTehsil" placeholder="Tehsil filter"><select id="aGender"><option value="">All gender</option><option value="male">लड़का</option><option value="female">लड़की</option></select><select id="aStatus"><option value="">All status</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="blocked">Blocked</option></select><button class="btn primary" id="load">Filter</button></div><div id="adminResults" class="cards"></div></div>
</section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
